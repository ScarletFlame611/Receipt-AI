# Детекция и выравнивание чека (Блок 3).
detector:
  method: "yolo"            # yolo | contour (fallback)
  weights_path: "weights/detector/best.pt"
  conf_threshold: 0.25
  iou_threshold: 0.45
  input_size: 640

  # Резервный контурный метод (OpenCV)
  fallback:
    enabled: true
    min_area_ratio: 0.15    # мин. доля площади кадра, чтобы счесть контур чеком
    canny_low: 50
    canny_high: 150

  # Целевые ориентиры (ТЗ, разд. 12.4)
  targets:
    successful_alignment: 0.90