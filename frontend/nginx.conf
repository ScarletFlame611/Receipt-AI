# Раздача SPA + проксирование API на бэкенд.
# Префиксы соответствуют роутерам FastAPI (ср. vite.config.js dev-прокси).

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Лимит на загрузку файлов чуть больше MAX_UPLOAD_MB (15 МБ), с запасом.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # --- API: проксируем на бэкенд ---
    # Регэксп-локейшн ловит все префиксы роутеров одним правилом.
    location ~ ^/(auth|receipts|analytics|admin|categories|api)(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ML-инференс одного чека — до ~10с (а первый запрос ещё и греет модели),
        # поэтому щедрые таймауты, чтобы nginx не рвал долгие ответы.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- SPA: всё остальное отдаём из статики, fallback на index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеш статических ассетов Vite (имена с хешем — можно кешировать надолго).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
