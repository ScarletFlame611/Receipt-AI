# Извлечение полей чека
donut:
  base_model: "naver-clova-ix/donut-base-finetuned-cord-v2"

  # Поля
  fields:
    weights_path: "weights/donut_sroie"
    task_prompt: "<s_sroie>"
    max_length: 512
    field_order: ["company", "date", "address", "total"]

  # Позиции
  items:
    task_prompt: "<s_cord-v2>"
    max_length: 768

  image_size: [1280, 960]

  inference:
    num_beams: 1
    device: "auto"

  train:
    epochs: 15
    batch_size: 2
    grad_accum_steps: 4
    lr: 3.0e-5
    weight_decay: 0.01
    warmup_steps: 300
    fp16: true
    checkpoint_dir: "/content/drive/MyDrive/receipt-ai/checkpoints/donut_sroie"
    save_every_steps: 200
    resume_from_checkpoint: true

  targets:
    field_accuracy_total: 0.85
    field_accuracy_merchant: 0.80
    field_accuracy_date: 0.80