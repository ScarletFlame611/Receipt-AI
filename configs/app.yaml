# Настройки приложения, БД и загрузок.
app:
  name: "Receipt-AI"
  version: "1.0"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

uploads:
  allowed_extensions: ["jpg", "jpeg", "png", "heic"]
  max_upload_mb: 15

pipeline:
  target_latency_seconds: 10
  default_category: "Прочее"