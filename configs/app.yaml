# Настройки приложения, БД и загрузок.
# Секреты сюда НЕ пишем — они в .env. Здесь только несекретные дефолты.
app:
  name: "Receipt-AI"
  version: "1.0"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

uploads:
  allowed_extensions: ["jpg", "jpeg", "png", "heic"]
  max_upload_mb: 15

pipeline:
  # Полная обработка одного чека — ориентир до 10 сек на CPU (ТЗ, разд. 11)
  target_latency_seconds: 10
  default_category: "Прочее"