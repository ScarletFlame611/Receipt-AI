# Категоризация трат
categorizer:
  base_model: "bert-base-multilingual-cased"
  weights_path: "weights/categorizer_real"
  max_length: 128

  # Справочник классов
  labels:
    - "Продукты"
    - "Кафе и рестораны"
    - "Транспорт"
    - "Аптека"
    - "Развлечения"
    - "Прочее"

  inference:
    device: "auto"
    confidence_threshold: 0.45

  train:
    epochs: 10
    batch_size: 16
    lr: 2.0e-5
    weight_decay: 0.01
    fp16: true
    checkpoint_dir: "/content/drive/MyDrive/receipt-ai/checkpoints/categorizer"

  targets:
    macro_f1: 0.80